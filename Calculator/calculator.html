<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .calculator {
            width: 400px;
            background-color: #333;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .display {
            background-color: #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: right;
            font-size: 24px;
            height: 30px;
            overflow: hidden;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 10px;
        }
        
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #777;
        }
        
        button:active {
            background-color: #444;
        }
        
        .operator {
            background-color: #ff9500;
        }
        
        .operator:hover {
            background-color: #ffaa33;
        }
        
        .operator:active {
            background-color: #e68a00;
        }
        
        .memory {
            background-color: #666;
        }
        
        .memory:hover {
            background-color: #888;
        }
        
        .memory:active {
            background-color: #555;
        }
        
        .clear {
            background-color: #ff3b30;
        }
        
        .clear:hover {
            background-color: #ff5e54;
        }
        
        .clear:active {
            background-color: #e0352b;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="memory" id="mc">MC</button>
            <button class="memory" id="mr">MR</button>
            <button class="memory" id="m-plus">M+</button>
            <button class="memory" id="m-minus">M-</button>
            <button class="clear" id="clear">Clear</button>
            
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">÷</button>
            <button class="operator">%</button>
            
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">*</button>
            <button class="operator">1/x</button>
            
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">-</button>
            <button class="operator">+</button>
            
            <button class="number">0</button>
            <button class="number">.</button>
            <button class="operator" id="plus-minus">+/-</button>
            <button class="operator" id="equals" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let memoryValue = 0;
        let resetScreen = false;

        const display = document.getElementById('display');
        const numberButtons = document.querySelectorAll('.number');
        const operatorButtons = document.querySelectorAll('.operator:not(#plus-minus):not(#equals)');
        const clearButton = document.getElementById('clear');
        const plusMinusButton = document.getElementById('plus-minus');
        const equalsButton = document.getElementById('equals');
        const mcButton = document.getElementById('mc');
        const mrButton = document.getElementById('mr');
        const mPlusButton = document.getElementById('m-plus');
        const mMinusButton = document.getElementById('m-minus');

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function appendNumber(number) {
            if (currentInput === '0' || resetScreen) {
                currentInput = number;
                resetScreen = false;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentInput === '') return;
            if (previousInput !== '') {
                compute();
            }
            operation = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        function compute() {
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '÷':
                    computation = prev / current;
                    break;
                case '%':
                    computation = prev % current;
                    break;
                case '1/x':
                    computation = 1 / prev;
                    break;
                default:
                    return;
            }
            
            currentInput = computation.toString();
            operation = null;
            previousInput = '';
            resetScreen = true;
            updateDisplay();
        }

        function clear() {
            currentInput = '0';
            previousInput = '';
            operation = null;
            updateDisplay();
        }

        function toggleSign() {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
        }

        function handleMemory(action) {
            switch (action) {
                case 'MC':
                    memoryValue = 0;
                    break;
                case 'MR':
                    currentInput = memoryValue.toString();
                    updateDisplay();
                    break;
                case 'M+':
                    memoryValue += parseFloat(currentInput) || 0;
                    break;
                case 'M-':
                    memoryValue -= parseFloat(currentInput) || 0;
                    break;
            }
        }

        numberButtons.forEach(button => {
            button.addEventListener('click', () => {
                appendNumber(button.textContent);
            });
        });

        operatorButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (button.textContent === '1/x') {
                    currentInput = (1 / parseFloat(currentInput)).toString();
                    updateDisplay();
                } else {
                    chooseOperation(button.textContent);
                }
            });
        });

        equalsButton.addEventListener('click', compute);
        clearButton.addEventListener('click', clear);
        plusMinusButton.addEventListener('click', toggleSign);

        mcButton.addEventListener('click', () => handleMemory('MC'));
        mrButton.addEventListener('click', () => handleMemory('MR'));
        mPlusButton.addEventListener('click', () => handleMemory('M+'));
        mMinusButton.addEventListener('click', () => handleMemory('M-'));

        // Handle keyboard input
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            else if (e.key === '.') appendNumber('.');
            else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                const opMap = {
                    '+': '+',
                    '-': '-',
                    '*': '*',
                    '/': '÷'
                };
                chooseOperation(opMap[e.key]);
            }
            else if (e.key === 'Enter' || e.key === '=') compute();
            else if (e.key === 'Escape') clear();
            else if (e.key === '%') chooseOperation('%');
        });
    </script>
</body>
</html>
